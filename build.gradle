plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the repositories needed for Minecraft, Fabric Loader and Fabric API.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"redplanet" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "redplanet-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}

	// Block states, models, loot, tags, recipes and lang -> src/main/generated (./gradlew runDatagen).
	// Runs in the client environment because model generation is client-only code.
	configureDataGeneration {
		client = true
		modId = "redplanet"
		strictValidation = true
	}
}

// Must come after configureTests, which creates the gameTest and clientGameTest run configurations.
loom {
	runs {
		gameTest {
			property "fabric-api.gametest.report-file", file("build/reports/gametest/server-gametests.xml").absolutePath
			property "fabric-api.gametest.filter", "redplanet-gametest:*"
		}
		clientGameTest {
			programArgs "--graphicsBackend", "opengl", "--width", "1280", "--height", "720"
			property "redplanet.gametest.screenshotDir", file("build/gametest-screenshots").absolutePath
			property "redplanet.gametest.noSrgbFramebuffer", "true"
		}
	}
}

// The server gametest world is reused between runs (only the client run directory is cleared): start clean.
def cleanGameTestWorld = tasks.register("cleanGameTestWorld", Delete) {
	delete file("build/run/gameTest/world")
}
tasks.named("runGameTest") {
	dependsOn cleanGameTestWorld
}
// Client gametests need a display with GLX. Loom's built-in Xvfb lacks a matching GLX visual here, so run them
// through scripts/run-client-gametests.sh (xvfb-run with GLX and 24-bit colour) or on a real display.
tasks.named("runClientGameTest") {
	useXvfb = false
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain JUnit tests for the Minecraft-independent logic (geography, astronomy, flight profiles).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
